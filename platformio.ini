; E-ink weather dashboard - LilyGo T5 4.7" (ESP32-WROVER, 16 MB flash, 8 MB PSRAM)
;
;   pio run -t upload        build and flash
;   pio device monitor       serial log (115200)

[env:t5-47]
platform = espressif32@6.9.0          ; Arduino-ESP32 2.0.x
board = esp32dev
framework = arduino
board_build.partitions = huge_app.csv  ; one 3 MB app slot, no OTA needed
monitor_speed = 115200
build_flags =
    -DBOARD_HAS_PSRAM                  ; framebuffer lives in PSRAM
    -mfix-esp32-psram-cache-issue
lib_deps =
    xinyuan-lilygo/LilyGoEPD47@^0.3.0
    bblanchon/ArduinoJson@^7.4.0
    paulstoffregen/OneWire@^2.3.8
    milesburton/DallasTemperature@^4.0.0
